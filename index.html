// =====================================================================
//  과거 기록 가져오기 (대표 전용) — 엑셀·CSV·붙여넣기 → 미리보기 → 묶음 저장 · 취소 · 데이터 정리
// =====================================================================
const IMP = { rows: [], unknown: {}, fileName: '', table: null };
const IMP_HEAD = {
  date:['날짜','일자','근무일','date','day'], name:['이름','성명','직원','직원명','name','employee','employeename'], empId:['사번','employeeid','empid','id'],
  end:['퇴근','퇴근시간','실제퇴근','실제퇴근시간','actualendtime','actualend','end'], start:['시작','시작시간','출근','starttime','start'], endSp:['종료','종료시간','endtime'],
  brk:['휴게','휴게분','휴게(분)','break','breakminutes'], type:['유형','구분','type'], note:['메모','비고','note','memo'], workEnd:['정규퇴근','workendtime']
};
const impNorm = v => String(v??'').trim().toLowerCase().replace(/\s+/g,'');
function impHeadKey(cell) { const c = impNorm(cell); if (!c) return null; for (const [k, names] of Object.entries(IMP_HEAD)) if (names.includes(c)) return k; return null; }
// 시간: "21:12" "2112" "21시12분" "9:5" / Date 객체 / 엑셀 소수(0.88) → "HH:MM"
function impTime(v) {
  if (v instanceof Date && !isNaN(v)) return `${pad(v.getHours())}:${pad(v.getMinutes())}`;
  if (typeof v === 'number') { if (v >= 0 && v < 1) { const m = Math.round(v*1440); return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`; } if (v >= 100 && v <= 2959 && Number.isInteger(v)) return `${pad(Math.floor(v/100))}:${pad(v%100)}`; return null; }
  const s = String(v??'').trim(); if (!s) return null;
  let m = s.match(/^(\d{1,2})\s*[:시.]\s*(\d{1,2})\s*분?$/); if (m) return `${pad(+m[1])}:${pad(+m[2])}`;
  m = s.match(/^(\d{1,2})\s*시$/); if (m) return `${pad(+m[1])}:00`;
  m = s.match(/^(\d{3,4})$/); if (m) { const n=+m[1]; return `${pad(Math.floor(n/100))}:${pad(n%100)}`; }
  m = s.match(/(\d{1,2}):(\d{2})/); if (m) return `${pad(+m[1])}:${m[2]}`;
  return null;
}
// 날짜: "2026-02-02" "2026.2.2" "2/2" "2일" / Date / 엑셀 일련번호 → "YYYY-MM-DD" (연·월이 없으면 기본값 사용)
function impDate(v, defY, defM) {
  if (v instanceof Date && !isNaN(v)) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if (typeof v === 'number') { if (v > 20000 && v < 80000 && typeof XLSX !== 'undefined') { const d = XLSX.SSF.parse_date_code(v); return `${d.y}-${pad(d.m)}-${pad(d.d)}`; } if (v >= 1 && v <= 31 && defY && defM) return `${defY}-${pad(defM)}-${pad(v)}`; return null; }
  const s = String(v??'').trim(); if (!s) return null;
  let m = s.match(/^(\d{4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})일?/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{2})[-./](\d{1,2})[-./](\d{1,2})$/); if (m) return `20${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[-./월\s]+(\d{1,2})일?(?:\s*\(.+\))?$/); if (m && defY) return `${defY}-${pad(+m[1])}-${pad(+m[2])}`;
  m = s.match(/^(\d{1,2})일?(?:\s*\(.+\))?$/); if (m && defY && defM) return `${defY}-${pad(defM)}-${pad(+m[1])}`;
  return null;
}
const impValidDate = d => !!d && /^\d{4}-\d{2}-\d{2}$/.test(d) && !isNaN(new Date(d+'T00:00:00')) && d <= todayStr();
function impType(v) { const c = impNorm(v); if (!c) return null; if (/특근|휴일|주말|special|holiday/.test(c)) return 'special'; if (/야근|연장|overtime|ot/.test(c)) return 'overtime'; return null; }
// 시트 이름에서 연·월 추출: "2026_2월" "2026-07" "7월" 등
function impSheetYM(name) { const s = String(name||''); const y = (s.match(/(20\d{2})/)||[])[1]; const m = (s.match(/(?:^|[^\d])(\d{1,2})\s*월/)||s.match(/20\d{2}[-._/](\d{1,2})/)||[])[1]; return { y: y?+y:null, m: m?+m:null }; }

// 붙여넣은 글 → 2차원 표
function impParseText(txt) {
  const lines = String(txt||'').split(/\r?\n/).filter(l => l.trim());
  const sep = lines.some(l => l.includes('\t')) ? '\t' : lines.some(l => l.includes(',')) ? ',' : null;
  return lines.map(l => sep ? l.split(sep).map(c => c.trim().replace(/^"|"$/g,'')) : l.trim().split(/\s{2,}|\s/));
}
// 2차원 표 → 기록 후보 목록. 세로형(날짜·이름·시간 열) 또는 가로형(직원 이름이 열 머리) 자동 판별
function impTableToRows(table, employees, defY, defM, sheetName) {
  const out = []; if (!table || !table.length) return out;
  const empByName = {}; employees.forEach(e => { empByName[impNorm(e.name)] = e; });
  // 1) 세로형: 머리줄에 알려진 제목이 2개 이상
  let hi = -1, map = {};
  for (let i=0; i<Math.min(table.length, 15); i++) { const m = {}; table[i].forEach((c,j) => { const k = impHeadKey(c); if (k && m[k]===undefined) m[k]=j; }); if (Object.keys(m).length >= 2 && (m.date!==undefined)) { hi = i; map = m; break; } }
  if (hi >= 0) {
    for (let i=hi+1; i<table.length; i++) { const r = table[i]; if (!r || !r.some(c => String(c??'').trim())) continue;
      const g = k => map[k]===undefined ? '' : r[map[k]];
      const row = { line: `${sheetName?sheetName+' ':''}${i+1}행`, date: impDate(g('date'), defY, defM), name: String(g('name')??'').trim(), empId: String(g('empId')??'').trim(), note: String(g('note')??'').trim() };
      const t = impType(g('type')); let st = impTime(g('start')), en = impTime(g('endSp')), end = impTime(g('end'));
      const rng = String(g('end')??'').match(/(\d{1,2}:\d{2})\s*[~\-]\s*(\d{1,2}:\d{2})/); if (rng) { st = rng[1]; en = rng[2]; end = null; }   // 퇴근 칸에 "09:00~18:00"이면 특근
      if (t === 'special' || (!end && st && en)) { row.type='special'; row.startTime=st; row.endTime=en; const bm = String(g('brk')??'').trim(); row.breakMinutes = bm==='' ? -1 : (parseInt(bm,10)||0); }   // -1 = 휴게 칸 없음 → 자동 제안
      else { row.type='overtime'; row.actualEndTime = end || en; row.workEndTime = impTime(g('workEnd')) || null; }
      out.push(row); }
    return out;
  }
  // 2) 가로형: 어떤 줄에 직원 이름이 2개 이상 → 그 줄이 머리줄, 각 이름 열의 값 = 퇴근 시간
  for (let i=0; i<Math.min(table.length, 15); i++) {
    const cols = []; table[i].forEach((c,j) => { const e = empByName[impNorm(c)]; if (e) cols.push({ j, e }); });
    if (cols.length >= 2) {
      const first = cols[0].j, ym = impSheetYM(sheetName); const y = ym.y || defY, m = ym.m || defM;
      for (let r=i+1; r<table.length; r++) { const row = table[r]; if (!row) continue;
        // 날짜: 이름 열 앞쪽 칸에서 찾는다 (한 칸에 날짜 / 연·월·일이 나뉜 칸 / 일만 있는 칸)
        let date = null; const pre = row.slice(0, first);
        for (const c of pre) { const d = impDate(c, y, m); if (d && /^\d{4}-\d{2}-\d{2}$/.test(d) && !(typeof c === 'number' && c <= 31)) { date = d; break; } }
        if (!date) { const nums = pre.map(c => typeof c === 'number' ? c : (String(c??'').trim().match(/^\d{1,4}$/) ? +c : null)).filter(n => n!==null);
          if (nums.length >= 3 && nums[0] > 1900) date = `${nums[0]}-${pad(nums[1])}-${pad(nums[2])}`; else if (nums.length === 2 && y) date = `${y}-${pad(nums[0])}-${pad(nums[1])}`; else if (nums.length === 1 && y && m) date = `${y}-${pad(m)}-${pad(nums[0])}`; }
        if (!date) continue;
        cols.forEach(({j, e}) => { const v = row[j]; const sv = String(v??'').trim(); if (!sv || /^[-–—xX×]$|정시|휴무|휴가|없음|^0$/.test(sv)) return;
          const sp = sv.match(/(\d{1,2}:\d{2})\s*[~\-]\s*(\d{1,2}:\d{2})/);
          if (sp) out.push({ line:`${sheetName?sheetName+' ':''}${r+1}행`, date, name:e.name, empId:e.employeeId, type:'special', startTime:sp[1], endTime:sp[2], breakMinutes:-1, note:'' });
          else { const t = impTime(v); out.push({ line:`${sheetName?sheetName+' ':''}${r+1}행`, date, name:e.name, empId:e.employeeId, type:'overtime', actualEndTime:t, raw: t?undefined:sv, note:'' }); } });
      }
      return out;
    }
  }
  return out;
}

function impTemplate() {
  const csv = '날짜,이름,유형,퇴근시간,시작,종료,휴게(분),메모\n2026-07-01,홍길동,야근,21:30,,,,\n2026-07-05,홍길동,특근,,09:00,18:00,60,토요일 출근\n';

function impFile(input) {
  const f = input.files[0]; if (!f) return; IMP.fileName = f.name;
  const rd = new FileReader();
  rd.onload = e => { try {
      if (/\.(xlsx|xls)$/i.test(f.name)) { const wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true }); IMP.table = wb.SheetNames.map(n => ({ name:n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'' }) })); }
      else { const txt = new TextDecoder('utf-8').decode(new Uint8Array(e.target.result)); IMP.table = [{ name:'', rows: impParseText(txt.replace(/^﻿/,'')) }]; }
      document.getElementById('imp-file').innerHTML = `${esc(f.name)} · 시트 ${IMP.table.length}개 · ${IMP.table.reduce((a,t)=>a+t.rows.length,0)}줄`;
      const ym = impSheetYM(IMP.table[0].name); if (ym.y) document.getElementById('imp-y').value = ym.y; if (ym.m) document.getElementById('imp-m').value = ym.m;
    } catch(err) { toast('파일을 읽지 못했습니다: '+err.message,'err'); } };
  rd.readAsArrayBuffer(f);
}
async function impAnalyze() {
  const box = document.getElementById('imp-result'); box.innerHTML = loadingHtml();
  try {
    const employees = await DATA.listEmployees(false), s = state.settings;
    const defY = parseInt(document.getElementById('imp-y').value,10)||null, defM = parseInt(document.getElementById('imp-m').value,10)||null;
    const txt = document.getElementById('imp-text').value.trim();
    const tables = txt ? [{ name:'', rows: impParseText(txt) }] : (IMP.table||[]);
    if (!tables.length) { box.innerHTML = '<div class="notice danger">파일을 고르거나 붙여넣기 칸에 내용을 넣어 주세요.</div>'; return; }
    let rows = []; tables.forEach(t => rows = rows.concat(impTableToRows(t.rows, employees, defY, defM, t.name)));
    if (!rows.length) { box.innerHTML = '<div class="notice danger">기록을 찾지 못했습니다. 첫 줄에 "날짜 · 이름 · 퇴근시간" 같은 제목이 있거나, 첫 줄에 직원 이름들이 있어야 합니다.</div>'; return; }
    // 직원 연결
    const byId = {}, byName = {}; employees.forEach(e => { byId[e.employeeId] = e; byName[impNorm(e.name)] = e; });
    const months = new Set(); rows.forEach(r => { if (impValidDate(r.date)) months.add(r.date.slice(0,7)); });
    const existing = new Set(); for (const m of months) (await DATA.listRecords({ month:m })).forEach(r => existing.add(`${r.employeeId}|${r.date}|${r.type||'overtime'}`));
    const seen = new Set(); const chosen = IMP.unknown || {}; IMP.unknown = {};   // 지난 분석에서 고른 연결(직원 사번 / '__skip')은 유지
    rows.forEach(r => {
      const known = (r.empId && byId[r.empId]) || byName[impNorm(r.name)] || null;
      const pick = (!known && r.name) ? (chosen[r.name] || '') : '';
      if (!known && r.name) IMP.unknown[r.name] = pick;
      if (!known && pick === '__skip') { r.status = 'skip'; r.msg = '건너뜀 (직원 연결 안 함)'; return; }
      const e = known || (pick ? byId[pick] : null);
      if (!e) { r.status = 'unknown'; r.msg = `직원 못 찾음: ${r.name||r.empId||'(이름 없음)'}`; return; }
      r.emp = e;
      if (!impValidDate(r.date)) { r.status='error'; r.msg = r.date ? `날짜 이상: ${r.date}` : '날짜 없음'; return; }
      if (r.type === 'special') { if (!r.startTime || !r.endTime) { r.status='error'; r.msg='특근 시작·종료 시간 없음'; return; } if (r.breakMinutes < 0) { r.breakMinutes = autoBreak(calcSpecial(r.startTime, r.endTime, 0).gross); if (r.breakMinutes) r.msg = `휴게 ${r.breakMinutes}분 자동 적용`; } const c = calcSpecial(r.startTime, r.endTime, r.breakMinutes||0); if (c.minutes <= 0) { r.status='error'; r.msg='특근 0분'; return; } r.minutes = c.minutes; r.night = c.night; }
      else { if (!r.actualEndTime) { r.status='error'; r.msg = r.raw ? `퇴근시간 못 읽음: ${r.raw}` : '퇴근시간 없음'; return; } const we = r.workEndTime || s.workEnd; const c = calcOvertime(we, r.actualEndTime); if (c.minutes <= 0) { r.status='skip'; r.msg=`정규 퇴근(${we}) 이전 → 야근 0분`; return; } r.workEndTime = we; r.minutes = c.minutes; r.night = c.night; }
      const key = `${e.employeeId}|${r.date}|${r.type}`;
      if (existing.has(key)) { r.status='dup'; r.msg='이미 있는 기록'; return; }
      if (seen.has(key)) { r.status='dup'; r.msg='자료 안에서 중복'; return; }
      seen.add(key); r.status='ok';
    });
    IMP.rows = rows;
    impRenderPreview(employees);
  } catch(e) { console.error(e); box.innerHTML = errorHtml(e, 'impAnalyze()'); }
}
function impRenderPreview(employees) {
  const rows = IMP.rows, box = document.getElementById('imp-result');
  const n = k => rows.filter(r => r.status===k).length, ok = n('ok');
  const unk = Object.keys(IMP.unknown);
  const chip = { ok:'<span class="chip chip-ok">저장</span>', dup:'<span class="chip chip-gray">중복</span>', skip:'<span class="chip chip-warn">건너뜀</span>', error:'<span class="chip chip-danger">오류</span>', unknown:'<span class="chip chip-danger">직원?</span>' };
  const months = [...new Set(rows.filter(r=>r.status==='ok').map(r=>r.date.slice(0,7)))].sort();
  box.innerHTML = `<div class="card" style="margin-bottom:12px;"><div class="card-title">2. 미리보기</div>
      <div class="stats" style="grid-template-columns:repeat(4,1fr);"><div class="stat accent"><div class="k">저장</div><div class="v">${ok}</div></div><div class="stat"><div class="k">중복</div><div class="v">${n('dup')}</div></div><div class="stat"><div class="k">건너뜀</div><div class="v">${n('skip')}</div></div><div class="stat ${n('error')+n('unknown')?'night':''}"><div class="k">오류</div><div class="v">${n('error')+n('unknown')}</div></div></div>
      ${months.length?`<div class="tiny muted mb8">저장 대상 달: ${months.map(monthLabel).join(' · ')} · 직원 ${[...new Set(rows.filter(r=>r.status==='ok').map(r=>r.emp.name))].join(', ')}</div>`:''}
      ${unk.length?`<div class="notice">이름을 못 찾은 사람이 있습니다. 누구인지(또는 건너뛰기) 고르고 "다시 분석"을 누르세요. 고른 내용은 다시 분석해도 유지됩니다.<div class="mt8">${unk.map(nm=>`<div class="kv"><span>${esc(nm)}</span><select class="inline" style="max-width:160px;" onchange="IMP.unknown['${esc(nm)}']=this.value"><option value="">고르세요</option><option value="__skip" ${IMP.unknown[nm]==='__skip'?'selected':''}>건너뛰기 (안 넣음)</option>${employees.map(e=>`<option value="${esc(e.employeeId)}" ${IMP.unknown[nm]===e.employeeId?'selected':''}>${esc(e.name)} (${esc(e.employeeId)})</option>`).join('')}</select></div>`).join('')}</div><button class="btn btn-ghost btn-sm btn-full mt8" onclick="impAnalyze()">다시 분석</button></div>`:''}
      <div style="overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:12px;"><table class="imp-table"><tr><th>상태</th><th>날짜</th><th>직원</th><th>구분</th><th>시간</th><th>근무</th><th>비고</th></tr>
        ${rows.slice(0,300).map(r=>`<tr class="${r.status}"><td>${chip[r.status]||''}</td><td>${esc(r.date||'')}</td><td>${esc(r.emp?r.emp.name:(r.name||r.empId||''))}</td><td>${r.type==='special'?'특근':'야근'}</td><td>${esc(r.type==='special'?`${r.startTime||'?'}~${r.endTime||'?'}${r.breakMinutes?` (휴게 ${r.breakMinutes})`:''}`:(r.actualEndTime||r.raw||''))}</td><td>${r.minutes?fmtMin(r.minutes):'-'}</td><td class="l">${esc(r.msg||r.note||'')}<span class="tiny muted"> ${esc(r.line||'')}</span></td></tr>`).join('')}</table>${rows.length>300?`<div class="tiny muted" style="padding:6px;">… 외 ${rows.length-300}줄</div>`:''}</div>
      <div class="field mt12"><label>가져오기 메모 (이력에 남음)</label><input id="imp-note" placeholder="예: 7~10월 종이 기록지" value="${esc(IMP.fileName)}"></div>
      <button class="btn btn-primary btn-full btn-lg" id="imp-save" onclick="impSave()" ${ok?'':'disabled'}>${ok}건 저장하기</button>
      <div class="tiny muted mt8">저장되는 기록에는 "과거 입력" 표시가 붙고, 등록자는 ${esc(state.user.name)}(대표)로 남습니다. 직원 본인은 이 기록을 수정할 수 있습니다(사유 필수).</div></div>`;
}
async function impSave() {
  const list = IMP.rows.filter(r => r.status==='ok'); if (!list.length) return;
  const btn = document.getElementById('imp-save'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 저장 중';
  const batch = 'imp_' + Date.now().toString(36), note = (document.getElementById('imp-note')?.value||'').trim();
  try {
    const recs = list.map(r => { const base = { employeeId:r.emp.employeeId, employeeName:r.emp.name, date:r.date, month:r.date.slice(0,7), type:r.type, note:r.note||'', createdBy:state.user.employeeId, editCount:0, source:'import', importBatch:batch, importedBy:state.user.employeeId, nightMinutes:r.night||0 };
      return r.type==='special' ? { ...base, startTime:r.startTime, endTime:r.endTime, breakMinutes:r.breakMinutes||0, specialMinutes:r.minutes } : { ...base, workEndTime:r.workEndTime, actualEndTime:r.actualEndTime, overtimeMinutes:r.minutes }; });
    const ids = await DATA.addRecords(recs);
    await DATA.addAudits(recs.map((rec,i) => ({ action:'import', recordId:ids[i], before:null, after:rec, reason:`과거 기록 가져오기${note?' · '+note:''}`, modifiedBy:state.user.employeeId, modifiedByName:state.user.name, modifiedByRole:state.user.role, targetEmployee:rec.employeeId, targetEmployeeName:rec.employeeName, targetDate:rec.date, importBatch:batch })));
    await DATA.saveImportBatch(batch, { at:new Date().toISOString(), by:state.user.name, count:recs.length, note, months:[...new Set(recs.map(r=>r.month))].sort() });
    closeSheet(); toast(`${recs.length}건을 넣었습니다`,'ok'); state.admTab='records'; state.admMonth = recs[recs.length-1].month; state.admEmp='all'; admTab('records');
  } catch(e) { console.error(e); toast('저장 실패: '+e.message,'err'); btn.disabled=false; btn.textContent='다시 시도'; }
}
async function openImportHistory() {
  if (state.user.role !== 'superadmin') { toast('대표만 할 수 있습니다','err'); return; }
  openSheet(loadingHtml());
  try { const list = await DATA.listImportBatches();
    openSheet(`<div class="sheet-title">↩ 가져오기 내역</div><div class="sheet-sub">묶음을 취소하면 그때 넣은 기록이 전부 지워지고, 지운 내용은 이력에 남습니다. 직원이 그 뒤 수정한 기록도 함께 지워집니다.</div>
      ${list.length?`<div class="list">${list.map(b=>`<div class="setrow"><div class="ico"></div><div class="lbl">${esc(b.note||b.id)}<small>${fmtDT(b.at)} · ${esc(b.by||'')} · ${b.count}건 · ${(b.months||[]).map(monthLabel).join(', ')}${b.undoneAt?` · <b style="color:var(--danger)">취소됨 ${fmtDT(b.undoneAt)}</b>`:''}</small></div>${b.undoneAt?'':`<button class="btn btn-danger-soft btn-xs" onclick="impUndo('${esc(b.id)}')">취소</button>`}</div>`).join('')}</div>`:`<div class="empty"><div class="ico"></div><p>가져온 묶음이 없습니다</p></div>`}
      <div class="sheet-foot"><button class="btn btn-ghost" onclick="closeSheet()">닫기</button></div>`);
  } catch(e) { openSheet(errorHtml(e, 'openImportHistory()')); }
}
function impUndo(batch) {
  confirmDlg('↩','가져오기 취소','이 묶음으로 넣은 기록을 전부 지웁니다.\n지운 내용은 이력에 남습니다. 진행할까요?',[{label:'아니오'},{label:'전부 지우기',cls:'btn-danger',fn:async()=>{
    try { const recs = await DATA.listRecordsByBatch(batch); if (!recs.length) { toast('지울 기록이 없습니다','warn'); }
      else { await DATA.deleteRecords(recs.map(r=>r.id)); await DATA.addAudits(recs.map(r => ({ action:'import_undo', recordId:r.id, before:r, after:null, reason:'가져오기 묶음 취소', modifiedBy:state.user.employeeId, modifiedByName:state.user.name, modifiedByRole:state.user.role, targetEmployee:r.employeeId, targetEmployeeName:r.employeeName, targetDate:r.date, importBatch:batch }))); }
      await DATA.saveImportBatch(batch, { undoneAt:new Date().toISOString() }); toast(`${recs.length}건 지움`,'ok'); openImportHistory(); }
    catch(e) { toast('실패: '+e.message,'err'); } }}]);
}
// 데이터 정리: month 필드가 없는 예전 기록에 채워 넣기 (한 번만)
function runMigrate() {
  if (state.user.role !== 'superadmin') { toast('대표만 할 수 있습니다','err'); return; }
  confirmDlg('','데이터 정리','모든 기록을 한 번 읽어 달(month) 표시가 없는 기록에 채웁니다.\n기록 내용(시간·메모)은 바뀌지 않습니다. 진행할까요?',[{label:'취소'},{label:'정리하기',cls:'btn-primary',fn:async()=>{
    toast('정리 중…'); try { const all = await DATA.listAllRecords(); const need = all.filter(r => r.date && r.month !== r.date.slice(0,7)).map(r => [r.id, { month: r.date.slice(0,7) }]);
      if (need.length) await DATA.updateRecords(need);
      await DATA.saveSettings({ monthIndexed:true }); state.settings.monthIndexed = true;
      await DATA.addAudit({ action:'migrate', recordId:'migrate', before:null, after:{ total:all.length, updated:need.length }, reason:`데이터 정리: ${need.length}건에 month 채움 (전체 ${all.length}건)`, modifiedBy:state.user.employeeId, modifiedByName:state.user.name, modifiedByRole:state.user.role, targetEmployee:'', targetEmployeeName:'', targetDate:'' });
      toast(`정리 완료: ${need.length}건 채움 (전체 ${all.length}건)`,'ok'); renderAdm(); }
    catch(e) { toast('실패: '+e.message,'err'); } }}]);
}

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (Pref.get('mode','light')==='auto') applyTheme(); });
